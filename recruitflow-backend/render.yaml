# Render Blueprint — deploys the RecruitFlow backend as a Docker web service.
# Persistent container: WebSockets (/ats/ws), the intake scheduler, and the
# in-process event bus all run normally.
#
# NOTE: on the free plan the service spins down after ~15 min of inactivity and
# takes ~40-60s to wake on the next request. The frontends retry patiently
# through that window (see each repo's lib/api.ts), so users see a short wait
# rather than a 502/504.
services:
  - type: web
    name: recruitflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # App reads $PORT (injected by Render) via the Dockerfile CMD.
      # Comma-separated production frontend origins for CORS, e.g.
      # https://recruitflow-website.vercel.app,https://recruitflow-recruiter.vercel.app,https://recruitflow-admin.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Candidate-login OAuth callback (proxied through the website's Vercel domain).
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Calendar-connect OAuth callback — MUST be this backend's own URL, e.g.
      # https://recruitflow-ai-3u84.onrender.com/interviews/calendar/callback
      # (distinct from GOOGLE_REDIRECT_URI, which is proxied through Vercel).
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      # This service's public base URL; used as the calendar redirect fallback.
      - key: BACKEND_URL
        sync: false
      # Recruiter dashboard origin the calendar callback redirects back to, e.g.
      # https://recruitflow-ai-recruiter-dashboard.vercel.app
      - key: RECRUITER_DASHBOARD_URL
        sync: false
      # Business timezone (IANA name) recruiter wall-clock times are anchored in,
      # e.g. Australia/Sydney. Defaults to UTC if unset.
      - key: APP_TIMEZONE
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      # Email sending is via the Resend HTTPS API (Render blocks outbound SMTP).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
